<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Alert — xem trước</title></head>
<body>
<div class="tms">
<div class="tms-preview" style="flex-direction: column; align-items: stretch; max-width: 720px;">
  <div class="tms-alert tms-alert-crit" role="alert">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    <span class="tms-alert-body"><strong>Tài khoản tạm khóa đến 14:35.</strong> Sai mật khẩu 5 lần liên tiếp. Đặt lại mật khẩu để mở ngay.</span>
  </div>
  <div class="tms-alert tms-alert-warn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17v.01"></path></svg>
    <span class="tms-alert-body"><strong>Không tải được danh sách việc.</strong> Đang hiện dữ liệu lúc 14:12.</span>
    <button type="button" class="tms-btn tms-btn-sm tms-btn-secondary">Thử lại</button>
  </div>
  <div class="tms-alert tms-alert-ok" role="status">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9 17.5 20 6.5"></path></svg>
    <span class="tms-alert-body">Đã gán <span class="tms-mono">51C-306.12</span> cho <span class="tms-mono">TCLU6630920</span>.</span>
    <button type="button" class="tms-btn tms-btn-sm tms-btn-secondary">Hoàn tác</button>
  </div>
  <div class="tms-alert tms-alert-info">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.01"></path></svg>
    <span class="tms-alert-body">Chi phí chuyến chia theo định mức. Kế toán sửa được, kèm lý do bắt buộc.</span>
  </div>
</div>
</div>
</body>
</html>

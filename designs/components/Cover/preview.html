<!-- @dsCard height=288 -->
<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>TMS Container — bìa</title>
<style>
  html, body { margin: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  .cover svg { position: absolute; left: 0; top: 0; }
  .p { fill: var(--primary); }
  .c1 { fill: var(--chart-1); }
  .c4 { fill: var(--chart-4); }
  .s2 { fill: var(--surface-2); }
  .ac { fill: var(--accent); }
  .op { fill: var(--on-primary); }
  .rail { fill: var(--on-primary); fill-opacity: .4; }
  .cr { fill: var(--crit); }
  .wn { fill: var(--warn); }
  .sf { fill: var(--surface); }
  .ring { stroke: var(--primary); stroke-width: 3; }
  .num { font-family: var(--font-ui); font-size: 15px; font-weight: 700; text-anchor: middle; }
  .num-in { fill: var(--surface); }
  .num-p { fill: var(--primary); }
  .text { position: absolute; left: 48px; bottom: 48px; max-width: 432px; }
  .name { margin: 0; font-family: var(--font-ui); font-weight: 700; font-size: 80px; line-height: .95; color: var(--ink); letter-spacing: -0.02em; }
  .tag { margin: 14px 0 0; font-family: var(--font-ui); font-size: 15px; line-height: 1.4; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <!--
    Blocks: primary 408×216 slab (radius-card 12), chart-1 72×144, chart-4 144×96, surface-2 240×96, accent 24×24 (radius-chip 6) small.
    Arrangement: one blue slab bleeding off top and right, satellites on a 24px grid (space-24 gaps), lighter chart-1 left, darker chart-4 below.
    Pattern: the DeadlineTimeline motif on the slab: on-primary rail, past segment and "now" line, hour ticks every 24px, 3 numbered circles.
    Markers: crit, warn and surface circles (r=16, 28px + ring in primary), numbers in surface / primary, font-ui 700.
  -->
  <rect class="p" x="576" y="-24" width="408" height="216" rx="12"/>
  <rect class="c1" x="480" y="-24" width="72" height="144" rx="12"/>
  <rect class="ac" x="480" y="144" width="24" height="24" rx="6"/>
  <rect class="s2" x="576" y="216" width="240" height="96" rx="12"/>
  <rect class="c4" x="840" y="216" width="144" height="96" rx="12"/>
  <!-- rail, past segment -->
  <rect class="rail" x="600" y="118" width="336" height="4" rx="2"/>
  <rect class="op" x="600" y="118" width="48" height="4" rx="2"/>
  <!-- hour ticks -->
  <rect class="op" x="600" y="132" width="2" height="12"/>
  <rect class="rail" x="624" y="132" width="2" height="6"/>
  <rect class="op" x="648" y="132" width="2" height="12"/>
  <rect class="rail" x="672" y="132" width="2" height="6"/>
  <rect class="op" x="696" y="132" width="2" height="12"/>
  <rect class="rail" x="720" y="132" width="2" height="6"/>
  <rect class="op" x="744" y="132" width="2" height="12"/>
  <rect class="rail" x="768" y="132" width="2" height="6"/>
  <rect class="op" x="792" y="132" width="2" height="12"/>
  <rect class="rail" x="816" y="132" width="2" height="6"/>
  <rect class="op" x="840" y="132" width="2" height="12"/>
  <rect class="rail" x="864" y="132" width="2" height="6"/>
  <rect class="op" x="888" y="132" width="2" height="12"/>
  <rect class="rail" x="912" y="132" width="2" height="6"/>
  <rect class="op" x="934" y="132" width="2" height="12"/>
  <!-- "now" line -->
  <rect class="op" x="647" y="96" width="2" height="48"/>
  <!-- numbered markers -->
  <circle class="cr ring" cx="720" cy="120" r="16"/>
  <text class="num num-in" x="720" y="125.5">1</text>
  <circle class="wn ring" cx="792" cy="120" r="16"/>
  <text class="num num-in" x="792" y="125.5">2</text>
  <circle class="sf ring" cx="888" cy="120" r="16"/>
  <text class="num num-p" x="888" y="125.5">3</text>
</svg>
<div class="text">
  <h1 class="name">TMS<br>Container</h1>
  <p class="tag">Điều vận container theo từng mốc hạn, việc gấp hiện trước.</p>
</div>
</div>
</body>
</html>
